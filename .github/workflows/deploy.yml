name: Deploy to production (FTP)

# main への push で起動するが、production environment の承認待ちで一時停止。
# GitHub 上で Approve を押した時だけ本番(www.tate.jp / IIS)へFTP反映する。
#
# 方針（本番にGit外の手編集が多数あるため）:
#  - 今回の push で「追加・変更」された追跡ファイルだけをアップロード
#  - 削除(D)は自動実行しない（本番ファイルを誤って消さない）。削除分はログに警告表示のみ
#  - .github/ や .claude/ などの非サイトファイルはアップロード対象外
#
# ジョブ構成:
#  1. plan   … 承認ゲート無し。即実行してアップロード対象を確定し Summary に表示する
#  2. deploy … production environment（承認ゲート）。plan が出した一覧をそのままFTP送信
#  → 承認画面を開いた時点で「何が本番に上書きされるか」が分かる

on:
  push:
    branches: [main]
  # 手動実行（差分の基準コミットを指定できる）
  workflow_dispatch:
    inputs:
      base:
        description: '差分の基準コミット(SHA/タグ)。省略時は直前コミットとの差分'
        required: false
        default: ''

# 同時に複数デプロイが走らないよう直列化（承認待ちは温存）
concurrency:
  group: ftp-deploy-production
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # 1) アップロード対象を確定する（承認ゲートの外側なので即実行される）
  # ------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # github.event.before との diff に履歴が必要

      - name: Determine upload list
        id: plan
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          ZERO='0000000000000000000000000000000000000000'

          # 手動実行時は入力の base を優先
          INPUT_BASE='${{ github.event.inputs.base }}'
          if [ -n "$INPUT_BASE" ]; then
            echo "手動指定の基準コミットを使用: $INPUT_BASE"
            BEFORE="$INPUT_BASE"
          fi

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "有効な before SHA が無いため、直前コミットとの差分にフォールバック"
            BEFORE="${AFTER}~1"
          fi

          # 追加・変更ファイル
          git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" > raw.txt || true
          # 削除ファイル（警告表示のみ・自動削除しない）
          git diff --name-only --diff-filter=D "$BEFORE" "$AFTER" > deleted.txt || true

          # 非サイトファイルをここで落として、最終的なアップ対象を確定する
          : > upload.txt
          : > skipped.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*|.claude/*|.gitignore|.gitattributes|CLAUDE.md|README*|.git/*)
                echo "$f" >> skipped.txt; continue;;
            esac
            if [ ! -f "$f" ]; then
              echo "$f" >> skipped.txt; continue
            fi
            echo "$f" >> upload.txt
          done < raw.txt

          COUNT=$(wc -l < upload.txt | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          # ---- 承認者向けサマリ ----
          {
            echo "## 本番(www.tate.jp)へアップロードされるファイル"
            echo ""
            echo "差分の基準: \`${BEFORE}\` → \`${AFTER}\`"
            echo ""
            echo "> **確認してください**: 本番にはGit管理外の手編集があります。"
            echo "> 下の一覧に手編集した覚えのあるファイルが含まれていないか確認してから Approve してください。"
            echo ""
            echo "### アップロード対象 (${COUNT}件)"
            echo ""
            if [ -s upload.txt ]; then
              echo '```'
              cat upload.txt
              echo '```'
            else
              echo "_なし（デプロイジョブはスキップされます）_"
            fi
            if [ -s skipped.txt ]; then
              echo ""
              echo "### 除外（非サイトファイル）"
              echo ""
              echo '```'
              cat skipped.txt
              echo '```'
            fi
            if [ -s deleted.txt ]; then
              echo ""
              echo "### ⚠ 削除されたファイル（自動削除しません・本番では手動対応）"
              echo ""
              echo '```'
              cat deleted.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== アップロード対象 (${COUNT}件) ====="
          cat upload.txt || true

      - name: Save upload list
        uses: actions/upload-artifact@v4
        with:
          name: deploy-plan
          path: |
            upload.txt
            deleted.txt
          retention-days: 7

  # ------------------------------------------------------------------
  # 2) 承認後に、plan が確定した一覧だけをFTP送信する
  # ------------------------------------------------------------------
  deploy:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: production   # ← required reviewers による承認ゲート
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore upload list
        uses: actions/download-artifact@v4
        with:
          name: deploy-plan

      - name: Upload files via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -s upload.txt ]; then
            echo "アップロード対象なし。終了します。"
            exit 0
          fi

          uploaded=0
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue

            if [ ! -f "$f" ]; then
              echo "skip (ファイル無し): $f"; missing=$((missing+1)); continue
            fi

            # パスをURLエンコード（"company tate/" などスペース対策。/ は維持）
            enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$f")
            echo "アップロード: $f  ->  ftp://$FTP_HOST/$enc"
            curl -sS --fail --ftp-create-dirs -T "$f" --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$enc"
            uploaded=$((uploaded+1))
          done < upload.txt

          echo "===== 完了: アップ ${uploaded} 件 / 欠落 ${missing} 件 ====="
          {
            echo "## 本番反映 完了"
            echo ""
            echo "- アップロード: ${uploaded} 件"
            echo "- 欠落: ${missing} 件"
          } >> "$GITHUB_STEP_SUMMARY"
